# PropertyVerse – local stack:  docker compose up --build
#   web    http://localhost:3000      viewer, admin, import
#   api    http://localhost:4000      REST + SSE + /files
#   s3     http://localhost:8333      S3-compatible object storage (SeaweedFS)
# GPU Gaussian Splatting worker: docker compose --profile gpu up
x-env: &env
  DATABASE_URL: postgres://propertyverse:propertyverse@postgres:5432/propertyverse
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: propertyverse
  S3_ACCESS_KEY: propertyverse
  S3_SECRET_KEY: propertyverse-secret
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}
  VISION_PROVIDER: ${VISION_PROVIDER:-auto}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_VISION_MODEL: ${CLAUDE_VISION_MODEL:-claude-opus-5-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
  AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
  SPLAT_API_URL: ${SPLAT_API_URL:-}
  SPLAT_API_KEY: ${SPLAT_API_KEY:-}
  WORLDGEN_API_URL: ${WORLDGEN_API_URL:-}
  WORLDGEN_API_KEY: ${WORLDGEN_API_KEY:-}
  PANORAMA_API_URL: ${PANORAMA_API_URL:-}
  PANORAMA_API_KEY: ${PANORAMA_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: propertyverse
      POSTGRES_PASSWORD: propertyverse
      POSTGRES_DB: propertyverse
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertyverse"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=0
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]

  api:
    build: { context: ., dockerfile: docker/node.Dockerfile, target: api }
    environment: *env
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
    restart: on-failure

  seed:
    build: { context: ., dockerfile: docker/node.Dockerfile, target: api }
    environment: *env
    command: ["pnpm", "seed"]
    depends_on:
      api: { condition: service_started }
    restart: on-failure:10

  worker-node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: worker
      args: { NODE_IMAGE: "mcr.microsoft.com/playwright:v1.63.0-noble" }
    environment: *env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    shm_size: "1gb"
    restart: on-failure

  worker-py:
    build: { context: ., dockerfile: docker/py.Dockerfile }
    environment: *env
    depends_on:
      redis: { condition: service_healthy }
    restart: on-failure

  worker-py-gpu:
    profiles: ["gpu"]
    build: { context: ., dockerfile: docker/py-gpu.Dockerfile }
    environment: *env
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    environment:
      INTERNAL_API_URL: http://api:4000
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: on-failure

volumes:
  pgdata:
  s3data:
